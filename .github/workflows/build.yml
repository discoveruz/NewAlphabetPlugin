# Tests and builds the add-in on every push and pull request, and packs it into NewAlphabetPlugin-Setup.exe. A v* tag,
# or a version typed in when the workflow is run from the Actions tab, also publishes a GitHub release with that
# installer; installed add-ins find it there when they look for a new version.
name: Build

on:
  push:
    branches: [main, dev, ci/cd]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, such as 0.2.0. Leave it empty to only build.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    # windows-2022 has Visual Studio 2022 with the Office/SharePoint workload. The tests need its Office interop
    # assemblies, and the add-in build needs its VSTO build tools. Not windows-2025: its MSBuild comes from a newer
    # Visual Studio whose VSTO tooling can't publish (Microsoft.VisualStudio.Tools.Applications.Hosting is missing).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # The runner has no Word, so the Word tests are reported as skipped.
      - name: Run the tests
        run: dotnet test NewAlphabetPlugin.Tests --configuration Release --logger trx --results-directory TestResults

      - name: Upload the test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx

  build:
    name: Build the add-in
    runs-on: windows-2022
    outputs:
      artifact: ${{ steps.version.outputs.artifact }}
      release-tag: ${{ steps.version.outputs.release-tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: microsoft/setup-msbuild@v3

      # A release comes from a v* tag, which must match AssemblyVersion, or from a version typed in on the Actions tab.
      # A typed version goes into AssemblyInfo.cs for this build only (it is not committed), so the add-in shows it.
      - name: Read the version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $infoPath = 'NewAlphabetPlugin/Properties/AssemblyInfo.cs'
          $info = Get-Content $infoPath -Raw
          if ($info -notmatch '(?m)^\[assembly: AssemblyVersion\("(\d+\.\d+\.\d+)') {
            throw "There is no AssemblyVersion in $infoPath."
          }
          $version = $Matches[1]
          $releaseTag = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -ne "v$version") {
              throw "The tag $env:GITHUB_REF_NAME does not match AssemblyVersion $version in $infoPath. Raise AssemblyVersion to match before tagging, or release from the Actions tab instead."
            }
            $releaseTag = $env:GITHUB_REF_NAME
          } elseif ($env:RELEASE_VERSION) {
            if ($env:RELEASE_VERSION.Trim() -notmatch '^v?(\d+\.\d+\.\d+)$') {
              throw "Type the version as three numbers, such as 0.2.0, not '$env:RELEASE_VERSION'."
            }
            $version = $Matches[1]
            if ($env:GITHUB_REF -ne 'refs/heads/main') {
              throw "Releases are made from main, not $env:GITHUB_REF_NAME. Choose main under 'Use workflow from'."
            }
            $releaseTag = "v$version"
            if (git ls-remote --tags origin "refs/tags/$releaseTag") {
              throw "$releaseTag already exists. Type a higher version."
            }
            $info = $info -replace '(?m)^(\[assembly: Assembly(File)?Version\(")[^"]*', "`${1}$version.0"
            Set-Content $infoPath $info -NoNewline -Encoding utf8BOM
          }
          # The run number tells every build apart, for example 0.3.0.57.
          $application = "$version.$env:GITHUB_RUN_NUMBER"
          "version=$version" >> $env:GITHUB_OUTPUT
          "application=$application" >> $env:GITHUB_OUTPUT
          "artifact=NewAlphabetPlugin-$application" >> $env:GITHUB_OUTPUT
          "release-tag=$releaseTag" >> $env:GITHUB_OUTPUT

      # The VSTO runtime only runs an add-in whose manifests are signed. The add-in's certificate is not in the
      # repository, so its .pfx comes from the CLICKONCE_PFX_BASE64 secret. Without the secret (pull requests from
      # forks, or before it is set) a throwaway certificate that lasts one day signs the build. That shows it builds,
      # but a release needs the add-in's own certificate, which lasts ten years.
      - name: Set up the signing certificate
        id: cert
        env:
          PFX_BASE64: ${{ secrets.CLICKONCE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.CLICKONCE_PFX_PASSWORD }}
          RELEASE_TAG: ${{ steps.version.outputs.release-tag }}
        run: |
          if ($env:PFX_BASE64) {
            $pfx = [Convert]::FromBase64String($env:PFX_BASE64)
            $flags = [Security.Cryptography.X509Certificates.X509KeyStorageFlags]'UserKeySet, PersistKeySet'
            $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($pfx, [string]$env:PFX_PASSWORD, $flags)
            $store = [Security.Cryptography.X509Certificates.X509Store]::new('My', 'CurrentUser')
            $store.Open('ReadWrite')
            $store.Add($cert)
            $store.Close()
          } elseif ($env:RELEASE_TAG) {
            throw 'Releases must be signed with the add-in''s own certificate. Set the CLICKONCE_PFX_BASE64 secret.'
          } else {
            Write-Output '::warning::CLICKONCE_PFX_BASE64 is not set, so this build is signed with a throwaway certificate.'
            # The manifests need a CryptoAPI key, not the default CNG one, and a SHA-256 certificate, because Windows
            # is phasing out SHA-1.
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=NewAlphabetPlugin CI' `
              -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1) -HashAlgorithm SHA256 `
              -Provider 'Microsoft Enhanced RSA and AES Cryptographic Provider' -KeySpec Signature
          }
          "thumbprint=$($cert.Thumbprint)" >> $env:GITHUB_OUTPUT

      - name: Build the add-in
        env:
          THUMBPRINT: ${{ steps.cert.outputs.thumbprint }}
          APPLICATION_VERSION: ${{ steps.version.outputs.application }}
        run: >-
          msbuild NewAlphabetPlugin/NewAlphabetPlugin.csproj -target:Build -nologo -verbosity:minimal
          -property:Configuration=Release
          "-property:ManifestCertificateThumbprint=$env:THUMBPRINT"
          "-property:ApplicationVersion=$env:APPLICATION_VERSION"

      # Inno Setup packs the built add-in into NewAlphabetPlugin-Setup.exe (installer/NewAlphabetPlugin.iss). The setup
      # tells the VSTO runtime to trust the key the manifests are signed with, taken here from the built manifest.
      - name: Make the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLICATION_VERSION: ${{ steps.version.outputs.application }}
        run: |
          $manifest = Get-Content NewAlphabetPlugin/bin/Release/NewAlphabetPlugin.vsto -Raw
          if ($manifest -notmatch '<RSAKeyValue>.*?</RSAKeyValue>') {
            throw 'The built NewAlphabetPlugin.vsto has no public key.'
          }
          $publicKey = $Matches[0]
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --version 6.7.1 --no-progress -y
          }
          & $iscc "/DAppVersion=$env:VERSION" "/DFileVersion=$env:APPLICATION_VERSION" "/DPublicKey=$publicKey" installer/NewAlphabetPlugin.iss

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: installer/Output/NewAlphabetPlugin-Setup.exe
          if-no-files-found: error

  release:
    name: Release
    if: success() && needs.build.outputs.release-tag != ''
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}

      # After a tag push the tag already exists. For a version typed in on the Actions tab, this creates the tag on the
      # commit that was built. The installer has the same name in every release, which is what lets
      # releases/latest/download/NewAlphabetPlugin-Setup.exe always give the newest one.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.release-tag }}
        run: >-
          gh release create "$TAG" NewAlphabetPlugin-Setup.exe --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$TAG" --generate-notes
