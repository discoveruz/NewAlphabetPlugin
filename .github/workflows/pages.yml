# Puts the newest release's ClickOnce setup on the GitHub Pages site. People install the add-in from there, and Word
# looks there for a newer version every time it starts. The Build workflow starts this after each release; run it from
# the Actions tab to put the newest release back on the site, for example after turning GitHub Pages on.
name: Publish updates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish the newest release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the newest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir zip
          unzip -q zip/*.zip -d site
          ls -R site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
